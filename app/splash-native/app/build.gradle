apply plugin: 'com.android.application'

android {
    namespace 'dev.octos.splashnative'
    compileSdk 35
    defaultConfig {
        applicationId "dev.octos.splashnative"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1"
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets {
        main { jniLibs.srcDirs = ['src/main/jniLibs'] }
    }
    // No Material, no AndroidX: the experiment tests whether a Splash card renders as
    // native views, and pulling in a design system would blur that into a second
    // question.
    buildTypes { debug { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
