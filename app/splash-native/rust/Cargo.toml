[package]
name = "octos-splash-native"
version = "0.1.0"
edition = "2021"
publish = false

# Its OWN workspace, deliberately: octos-one's workspace pins makepad-widgets and the
# whole aichat render stack, and this experiment exists to prove a Splash card renders
# with none of it. Sharing a lock file would let those crates back in through a
# transitive edge and quietly invalidate the result.
[workspace]

[lib]
crate-type = ["cdylib"]

# The Splash DSL comes from ymote/Splash — `splash-core` re-exports the pinned,
# VENDORED makepad-script VM and nothing else. No makepad-platform, no makepad-draw,
# no widgets: the renderer here is Android's, so none of makepad's may come along.
[dependencies]
splash-core = { path = "../../../../Splash/crates/splash-core" }
jni = "0.21"
serde_json = "1"
ureq = { version = "2", features = ["tls"] }

[profile.release]
opt-level = 2
